<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Flatstock community-picked stocks in one tap with no gas." />
    <title>Flatstock</title>
    <style>
      :root { color: #edf8f0; background: #08110f; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 80% -10%, #174334 0, transparent 42%), #08110f; }
      main { width: min(720px, calc(100% - 40px)); padding: 32px 0; }
      .eyebrow { color: #7ed9a1; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 12px 0 18px; font-size: clamp(48px, 10vw, 92px); letter-spacing: -.07em; line-height: .9; }
      p { color: #b6d2bd; font-size: 18px; line-height: 1.5; }
      .notice { margin: 28px 0; padding: 14px 16px; border: 1px solid #385747; border-radius: 13px; color: #d7e8dc; font-size: 13px; }
      a { display: inline-block; padding: 14px 18px; border-radius: 12px; color: #082016; background: #9beab2; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Community-picked stocks</div>
      <h1>Flatstock</h1>
      <p>Buy the US stocks the community picked, in one tap, with no gas.</p>
      <div class="notice">Not available to US persons. Not investment advice.</div>
      <a href="https://app.flatstock.ajkadri.dev">Open the app</a>
    </main>
  </body>
</html>
